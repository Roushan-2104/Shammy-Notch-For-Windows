<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shammy lower page · island story prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300;600;800&family=Funnel+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700;800&family=Anek+Devanagari:wght@500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
/* Prototype only: three ways to tell the lower page as one island story. ?dir=A | B | C */
*{box-sizing:border-box}
html,body{margin:0;background:#05050A;color:#EFEFF3;font-family:'Funnel Sans',sans-serif}
.scroller{height:calc(100vh * 7.2)}
.stage{position:sticky;top:0;height:100vh;overflow:hidden}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h2{font:800 clamp(44px,6vw,92px)/.95 'Funnel Display',sans-serif;letter-spacing:-.04em;margin:0}
.lead{font-size:20px;line-height:1.5;color:#C9C5D6;max-width:30em;margin:18px 0 0}

/* The island, open: smoked glass with light inside. */
.isle{position:absolute;left:50%;border-radius:34px;overflow:hidden;font-family:'Schibsted Grotesk',sans-serif;color:#F4F3F0;
  background:radial-gradient(70% 90% at 12% 0%,var(--in1,rgba(107,63,216,.42)),transparent 70%),radial-gradient(60% 80% at 95% 15%,var(--in2,rgba(25,195,178,.3)),transparent 70%),rgba(10,10,15,.88);
  box-shadow:0 40px 120px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(24px);transition:width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1),background .8s}
.isle::after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:3px;background:linear-gradient(90deg,transparent,rgba(120,220,200,.9),rgba(160,140,255,.9),transparent)}
.isle .in{position:absolute;inset:0;padding:26px 30px}
.eyes{display:inline-flex;gap:6px}.eyes i{width:13px;height:21px;border-radius:7px;background:#F4F3F0}
.row{display:flex;align-items:center;gap:14px}
.cap{font:700 12px 'Schibsted Grotesk';letter-spacing:.12em;text-transform:uppercase;color:#A9A7A2}
.mono{font-family:'Geist Mono',monospace}
.btn2{height:46px;padding:0 24px;border-radius:23px;display:inline-flex;align-items:center;font:700 16px 'Schibsted Grotesk';background:rgba(255,255,255,.1)}
.btn2.on{background:#F9A3C0;color:#2A0F18}
.deva{font-family:'Anek Devanagari',sans-serif}
.caret{display:inline-block;width:2px;height:1em;background:#9FD8C2;vertical-align:-.12em;margin-left:3px;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.wave{display:flex;gap:4px;align-items:center;height:40px}.wave i{width:5px;border-radius:3px;background:rgba(255,255,255,.75);animation:wv 1s ease-in-out infinite alternate}@keyframes wv{from{transform:scaleY(.3)}to{transform:scaleY(1)}}

/* ---------- A · Pinned stage ---------- */
[data-dir=A] .world{position:absolute;inset:-10%;filter:blur(60px) saturate(1.2);transition:background 1s;background:radial-gradient(34% 42% at 18% 30%,var(--c1),transparent 70%),radial-gradient(30% 40% at 82% 22%,var(--c2),transparent 70%),radial-gradient(40% 40% at 60% 95%,var(--c3),transparent 70%),#05050A}
[data-dir=A] .isle{top:13vh;transform:translateX(-50%)}
[data-dir=A] .copy{position:absolute;left:7vw;bottom:10vh;max-width:56vw}
[data-dir=A] .rail{position:absolute;right:5vw;bottom:10vh;display:flex;flex-direction:column;gap:10px;font:500 15px 'Funnel Sans';color:rgba(239,239,243,.4);text-align:right}
[data-dir=A] .rail b{color:#EFEFF3;font-weight:600}
[data-dir=A] .rail span::before{content:'';display:inline-block;width:0;height:2px;background:#EFEFF3;vertical-align:middle;margin-right:10px;transition:width .4s}
[data-dir=A] .rail b::before{width:28px}

/* ---------- B · The island's desk ---------- */
[data-dir=B] .world,[data-dir=P] .world{position:absolute;inset:0;background:radial-gradient(60% 50% at 22% 70%,rgba(107,63,216,.55),transparent 70%),radial-gradient(50% 60% at 85% 30%,rgba(25,140,178,.45),transparent 70%),linear-gradient(160deg,#0B1030,#160B2A 60%,#05050A)}
[data-dir=B] .ribbon,[data-dir=P] .ribbon{position:absolute;left:-10%;right:-10%;top:48%;height:180px;filter:blur(40px);background:linear-gradient(90deg,transparent,rgba(127,240,216,.35),rgba(185,164,255,.45),rgba(255,179,199,.3),transparent);transform:skewY(-9deg)}
[data-dir=B] .bar,[data-dir=P] .bar{position:absolute;left:0;right:0;bottom:0;height:52px;background:rgba(20,20,30,.72);backdrop-filter:blur(30px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);display:flex;justify-content:center;align-items:center;gap:8px}
[data-dir=B] .bar i,[data-dir=P] .bar i{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.12)}
[data-dir=B] .bar i:first-child,[data-dir=P] .bar i:first-child{background:linear-gradient(135deg,#7FB2FF,#3A6FE0)}
[data-dir=B] .clock,[data-dir=P] .clock{position:absolute;right:18px;bottom:8px;font:500 13px 'Funnel Sans';text-align:right;line-height:1.35;color:#E6E6EE}
[data-dir=B] .isle,[data-dir=P] .isle{top:14px;transform:translateX(-50%);z-index:5}
[data-dir=B] .win,[data-dir=P] .win{position:absolute;border-radius:12px;background:rgba(28,28,38,.82);backdrop-filter:blur(30px);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1);opacity:0;transform:translateY(40px) scale(.97)}
[data-dir=B] .win.on,[data-dir=P] .win.on{opacity:1;transform:none}
[data-dir=B] .win .tb,[data-dir=P] .win .tb{height:40px;display:flex;align-items:center;padding:0 16px;font:500 13px 'Funnel Sans';color:#BEBCCB;justify-content:space-between}
[data-dir=B] .win .tb em,[data-dir=P] .win .tb em{font-style:normal;letter-spacing:12px;color:#8A889A}
[data-dir=B] .caption,[data-dir=P] .caption{position:absolute;left:4vw;bottom:96px;width:min(560px,40vw);padding:28px 30px;border-radius:26px;background:rgba(8,8,14,.66);backdrop-filter:blur(30px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
[data-dir=B] .caption h2,[data-dir=P] .caption h2{font-size:52px}
[data-dir=B] .caption .lead,[data-dir=P] .caption .lead{font-size:18px}

/* ---------- C · Macro ---------- */
[data-dir=C] .world{position:absolute;inset:0;transition:background 1s;background:var(--field)}
[data-dir=C] .giant{position:absolute;left:4vw;bottom:-3.2vw;font:800 21vw/.8 'Funnel Display';letter-spacing:-.06em;color:var(--ghost);white-space:nowrap;transition:color 1s}
[data-dir=C] .giant.deva{font-family:'Anek Devanagari';font-weight:600;bottom:-6vw}
[data-dir=C] .isle{top:46%;transform:translate(-50%,-50%) scale(1.45);transform-origin:50% 50%}
[data-dir=C] .copy{position:absolute;left:5vw;top:9vh;max-width:40vw}
[data-dir=C] .copy h2{font-size:56px}
[data-dir=C] .copy .lead{font-size:18px}
[data-dir=C] .num{position:absolute;right:5vw;top:9vh;font:300 64px/1 'Funnel Display';letter-spacing:-.03em;font-variant-numeric:tabular-nums}
[data-dir=C] .num small{font-size:24px;color:rgba(239,239,243,.5)}
</style>
</head>
<body>
<div class="scroller"><div class="stage" id="stage"></div></div>
<script>
const dir = new URLSearchParams(location.search).get('dir') || 'A';
document.body.dataset.dir = dir;
const stage = document.getElementById('stage');

const CH = [
  { key: 'claude', name: 'Claude', h: 'Claude asks.<br>You tap Allow.', lead: 'Your Claude Code sessions live in the island. When one wants to run a command, it asks up there, over whatever app you\'re in.',
    c: ['rgba(107,63,216,.7)', 'rgba(242,179,90,.35)', 'rgba(224,87,122,.4)'], field: 'radial-gradient(60% 70% at 30% 30%,#3A1F7A,transparent 70%),radial-gradient(50% 60% at 80% 80%,#5A3410,transparent 70%),#0B0816', ghost: 'rgba(185,164,255,.13)', giant: 'Allow.' },
  { key: 'talk', name: 'Hinglish', h: 'Talk in Hinglish.<br>It types.', lead: 'Hold Ctrl + Win in any app and talk. Your words show live in the island; let go and they\'re typed where your cursor is.',
    c: ['rgba(25,195,178,.6)', 'rgba(60,200,120,.4)', 'rgba(107,63,216,.4)'], field: 'radial-gradient(60% 70% at 25% 70%,#0E5A4E,transparent 70%),radial-gradient(50% 60% at 85% 20%,#173A6A,transparent 70%),#06100E', ghost: 'rgba(127,240,216,.12)', giant: 'हाँ, कल', deva: true },
  { key: 'music', name: 'Music', h: 'Your song,<br>in its own colours.', lead: 'The island takes its light from the cover of what you\'re playing. Drag the line to seek, scroll over it for volume.',
    c: ['rgba(200,40,40,.7)', 'rgba(40,150,70,.55)', 'rgba(120,20,30,.5)'], field: 'radial-gradient(70% 70% at 20% 30%,#8E1414,transparent 70%),radial-gradient(60% 60% at 85% 85%,#1F6A2C,transparent 70%),#140405', ghost: 'rgba(255,170,160,.12)', giant: 'Night Song',
    in1: 'rgba(200,40,40,.55)', in2: 'rgba(40,150,70,.45)' },
  { key: 'phone', name: 'Phone', h: 'Your phone<br>joins the island.', lead: 'Your laptop\'s notifications drop onto your phone, and your phone\'s onto the laptop. Files cross your own Wi-Fi.',
    c: ['rgba(90,120,255,.55)', 'rgba(107,63,216,.55)', 'rgba(25,195,178,.35)'], field: 'radial-gradient(60% 70% at 70% 30%,#1D2C7A,transparent 70%),radial-gradient(50% 60% at 15% 85%,#3A1F7A,transparent 70%),#070816', ghost: 'rgba(160,180,255,.12)', giant: 'Sent.' },
  { key: 'stage', name: 'Stage', h: 'Read your script.<br>Look at the lens.', lead: 'Stage puts your script right under the camera and follows your voice. Its ring light lights your face and never shows up in the share.',
    c: ['rgba(255,190,140,.5)', 'rgba(224,87,122,.35)', 'rgba(255,220,180,.3)'], field: 'radial-gradient(60% 70% at 50% 20%,#7A4A2A,transparent 70%),radial-gradient(50% 60% at 15% 85%,#4A1F33,transparent 70%),#120A08', ghost: 'rgba(255,214,180,.12)', giant: 'On air' },
  { key: 'alarm', name: 'Alarms', h: 'Alarms in<br>the sky outside.', lead: 'At 6:30 it\'s a sunrise. At 2 AM it\'s the moon, and we don\'t ask questions. One tap stops it.',
    c: ['rgba(255,150,80,.65)', 'rgba(90,46,58,.7)', 'rgba(255,200,120,.45)'], field: 'linear-gradient(180deg,#1E1626 0%,#5A2E3A 55%,#FFB070 100%)', ghost: 'rgba(255,236,210,.14)', giant: '6:30',
    in1: 'rgba(255,150,80,.5)', in2: 'rgba(255,200,140,.3)' },
];
const ROMAN = ['haan,', 'kal', '6', 'baje', 'cafe', 'pe', 'milte', 'hain'];
const DEVA = ['हाँ,', 'कल', '6', 'बजे', 'कैफ़े', 'पे', 'मिलते', 'हैं'];

// What the open island shows for a chapter at progress t (0 to 1).
function inside(ch, t) {
  if (ch.key === 'claude') {
    const allowed = t > .62;
    return { w: 640, h: 236, html: `<div class="in"><div class="row"><span class="eyes"><i></i><i></i></span><div><div class="cap">Claude Code · login-fix</div><div style="font-size:22px;font-weight:700;margin-top:4px">${allowed ? 'Allowed. Running npm test' : 'Wants to run a command'}</div></div><span style="margin-left:auto;color:#A9A7A2;font-size:14px">${allowed ? '✓ 42 passed' : 'waiting 0:0' + Math.floor(t * 9)}</span></div>
      <div class="mono" style="margin-top:18px;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.35);font-size:17px">npm test</div>
      <div class="row" style="justify-content:flex-end;margin-top:18px"><span class="btn2">Deny</span><span class="btn2 ${allowed ? 'on' : ''}" style="${allowed ? '' : 'box-shadow:inset 0 0 0 2px #F9A3C0'}">Allow</span></div></div>` };
  }
  if (ch.key === 'talk') {
    const n = Math.min(8, Math.floor(t * 11)), deva = t > .78;
    const words = (deva ? DEVA : ROMAN).slice(0, deva ? 8 : n).join(' ');
    return { w: 680, h: 170, html: `<div class="in"><div class="row"><span style="width:10px;height:10px;border-radius:50%;background:#FF5A5A;box-shadow:0 0 12px #FF5A5A"></span><span class="cap" style="color:#F4F3F0">Dictating</span><span class="cap">into WhatsApp · ${deva ? 'देवनागरी' : 'Roman'}</span><div class="wave" style="margin-left:auto">${[8, 18, 30, 22, 12, 26, 16].map((x, i) => `<i style="height:${x}px;animation-delay:${i * .12}s"></i>`).join('')}</div></div>
      <div class="${deva ? 'deva' : ''}" style="font-size:${deva ? 40 : 36}px;font-weight:600;margin-top:20px;white-space:nowrap">${words}<span class="caret"></span></div></div>` };
  }
  if (ch.key === 'music') {
    return { w: 660, h: 230, html: `<div class="in"><div class="row" style="gap:22px"><img src="../../public/img/night-song-cover.png" alt="" style="width:150px;height:150px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)"><div style="flex:1"><div class="cap">Now playing</div><div style="font-size:34px;font-weight:800;margin-top:6px;letter-spacing:-.01em">Night Song</div><div style="font-size:16px;color:#D8C9C6;margin-top:4px">Nusrat Fateh Ali Khan &amp; Michael Brook</div>
      <div style="margin-top:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.18)"><div style="width:${20 + t * 50}%;height:100%;border-radius:3px;background:#F4F3F0"></div></div><div class="row" style="justify-content:space-between;margin-top:8px;font-size:13px;color:#C9B9B6"><span>${1 + Math.floor(t * 3)}:${String(Math.floor(t * 59)).padStart(2, '0')}</span><span>6:07</span></div></div></div></div>` };
  }
  if (ch.key === 'phone') {
    const p = Math.min(100, Math.floor(t * 140));
    return { w: 560, h: 150, html: `<div class="in"><div class="row"><span class="eyes"><i></i><i></i></span><div style="flex:1"><div class="cap">To phone · Pixel 8</div><div style="font-size:22px;font-weight:700;margin-top:4px">${p < 100 ? 'Sending report.pdf' : 'On your phone'}</div></div><span style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">${p}%</span></div>
      <div style="margin-top:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)"><div style="width:${p}%;height:100%;border-radius:3px;background:linear-gradient(90deg,#9FD8C2,#B9A4FF)"></div></div></div>` };
  }
  if (ch.key === 'stage') {
    const line = 'Thanks for joining, everyone. Here\'s what changes for you this week.'.split(' ');
    const k = Math.floor(t * line.length);
    return { w: 760, h: 150, html: `<div class="in" style="text-align:center;padding-top:30px"><div style="font-size:30px;font-weight:700;line-height:1.3">${line.map((w, i) => `<span style="color:${i < k ? '#F4F3F0' : 'rgba(244,243,240,.35)'}">${w}</span>`).join(' ')}</div><div class="cap" style="margin-top:14px">Stage · follows your voice</div></div>` };
  }
  const sunY = 150 - t * 110;
  return { w: 640, h: 260, html: `<div class="in" style="background:linear-gradient(180deg,#1E1626 0%,#5A2E3A 55%,#FFB070 100%)"><span style="position:absolute;right:70px;top:${sunY}px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#FFF6E6,#FFA860);box-shadow:0 0 80px 24px rgba(255,186,120,.6)"></span>
    <div class="cap" style="color:#F4E6DA">Wake up · dawn</div><div style="font-size:96px;font-weight:600;letter-spacing:-.03em;margin-top:6px;line-height:1">6:30<span style="font-size:30px;margin-left:6px">AM</span></div><span class="btn2" style="position:absolute;left:30px;bottom:26px;background:#FFF1E4;color:#1B0E0A;height:50px;padding:0 44px">Stop</span></div>` };
}

const PHONE = (t, right, top, sc) => `<div style="position:absolute;right:${right};top:${top};width:260px;height:530px;border-radius:44px;background:#0A0A10;padding:12px;box-shadow:0 40px 100px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.1);transform:rotate(6deg) scale(${sc})"><div style="height:100%;border-radius:33px;background:radial-gradient(60% 40% at 30% 30%,rgba(107,63,216,.6),transparent),radial-gradient(60% 40% at 70% 80%,rgba(25,195,178,.5),transparent),#11111A;padding:16px 14px;font-family:'Schibsted Grotesk'"><div style="margin:0 auto 26px;width:110px;height:30px;border-radius:15px;background:#000;display:flex;align-items:center;gap:4px;padding:0 12px"><i style="width:7px;height:11px;border-radius:4px;background:#F4F3F0"></i><i style="width:7px;height:11px;border-radius:4px;background:#F4F3F0"></i></div>${t > .7 ? '<div style="padding:12px 14px;border-radius:18px;background:rgba(20,20,30,.88);font-size:14px;line-height:1.4;color:#F4F3F0"><b>report.pdf</b><br><span style="color:#A9A7A2">From your laptop · tap to open</span></div>' : ''}</div></div>`;
function frame(i, t) {
  const ch = CH[i], open = inside(ch, t);
  const isle = (transform) => `<div class="isle" style="width:${open.w}px;height:${open.h}px;${ch.in1 ? `--in1:${ch.in1};--in2:${ch.in2};` : ''}${transform ? `transform:${transform};` : ''}">${open.html}</div>`;
  if (dir === 'A') {
    stage.style.setProperty('--c1', ch.c[0]); stage.style.setProperty('--c2', ch.c[1]); stage.style.setProperty('--c3', ch.c[2]);
    stage.innerHTML = `<div class="world"></div><div class="grain"></div>${isle('translateX(-50%) scale(1.3);transform-origin:50% 0')}
      <div class="copy"><h2>${ch.h}</h2><p class="lead">${ch.lead}</p></div>
      ${ch.key === 'phone' ? PHONE(t, '12vw', '30vh', 1) : ''}<div class="rail">${CH.map((c, k) => k === i ? `<b><span></span>${c.name}</b>` : `<span>${c.name}</span>`).join('')}</div>`;
  } else if (dir === 'B') {
    const wins = {
      claude: `<div class="win on" style="left:46vw;top:200px;width:620px;height:360px"><div class="tb">Terminal · claude · login-fix<em>–▢✕</em></div><pre class="mono" style="margin:0;padding:10px 20px;font-size:15px;line-height:1.8;color:#D8D6E2">&gt; fix the failing login test
<span style="color:#9FD8C2">● Edited src/auth/session.ts (+6 −2)</span>
<span style="color:${t > .62 ? '#6E6A72' : '#F2B35A'}">? Allow Bash: npm test</span>
${t > .62 ? '<span style="color:#9FD8C2">✓ 42 tests passed (allowed from Shammy)</span>' : ''}</pre></div>`,
      talk: `<div class="win on" style="left:48vw;top:190px;width:520px;height:420px;background:rgba(14,32,26,.86)"><div class="tb">WhatsApp · Riya<em>–▢✕</em></div><div style="padding:18px 20px;display:flex;flex-direction:column;gap:12px;font-size:17px"><span style="align-self:flex-start;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.1)">kal milte hain?</span>${t > .78 ? '<span class="deva" style="align-self:flex-end;padding:10px 14px;border-radius:14px;background:#1F6E4E;font-size:20px">हाँ, कल 6 बजे कैफ़े पे मिलते हैं</span>' : ''}</div><div style="position:absolute;left:16px;right:16px;bottom:16px;height:46px;border-radius:23px;background:rgba(255,255,255,.08);padding:12px 18px;font-size:15px;color:#9A98A6">Type a message<span class="caret"></span></div></div>`,
      music: `<div class="win on" style="left:50vw;top:220px;width:460px;height:300px;overflow:hidden"><div class="tb">Music<em>–▢✕</em></div><div style="display:flex;gap:18px;padding:12px 20px"><img src="../../public/img/night-song-cover.png" alt="" style="width:170px;height:170px;border-radius:10px"><div style="font-size:15px;color:#BEBCCB;line-height:2">Night Song<br>Sweet Pain<br>My Heart, My Life<br>Longing</div></div></div>`,
      phone: `<div class="win on" style="left:62vw;top:150px;width:260px;height:520px;border-radius:40px;background:#0A0A10;padding:12px"><div style="height:100%;border-radius:30px;background:radial-gradient(60% 40% at 30% 30%,rgba(107,63,216,.6),transparent),radial-gradient(60% 40% at 70% 80%,rgba(25,195,178,.5),transparent),#11111A;padding:44px 14px">${t > .7 ? '<div style="padding:12px 14px;border-radius:18px;background:rgba(20,20,30,.85);font-size:14px;line-height:1.4"><b>report.pdf</b><br><span style="color:#A9A7A2">From your laptop · tap to open</span></div>' : ''}</div></div>`,
      stage: `<div class="win on" style="left:44vw;top:150px;width:640px;height:440px;background:#15110F;box-shadow:0 0 0 10px rgba(255,214,180,.85),0 0 120px 30px rgba(255,200,150,.35)"><div class="tb">Meet · Weekly sync<em>–▢✕</em></div><div style="position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:300px;height:300px;border-radius:150px 150px 0 0;background:radial-gradient(60% 50% at 50% 40%,#C99A7A,#6A4A3A 70%,transparent 72%),radial-gradient(90% 60% at 50% 110%,#2E3550,#2E3550 60%,transparent 62%)"></div></div>`,
      alarm: '',
    };

}
